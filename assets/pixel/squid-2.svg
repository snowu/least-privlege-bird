<!-- "Panic squid" frame 2: tentacles tightened together, pushing through water on
     a flap/jump. Same mantle as squid.svg; only the tentacles pull in. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M6 -0.5h4v.5H6zM5.5 0h5v.5H5.5zM5 0.5h6v.5H5zM4.5 1h7v.5H4.5zM4 1.5h8v.5H4zM3.5 2h9v.5H3.5zM3.5 2.5h9v.5H3.5zM3.5 3h9v.5H3.5zM3.5 3.5h9v.5H3.5zM3.5 4h9v.5H3.5zM3.5 4.5h9v.5H3.5zM3.5 5h9v.5H3.5zM3.5 5.5h9v.5H3.5zM4 6h8v.5H4zM4.5 6.5h7v.5H4.5zM4.5 7h6.5v.5H4.5zM4.5 7.5h6v.5H4.5zM4.5 8h6v.5H4.5zM4.5 8.5h6v.5H4.5zM4.5 9h6v.5H4.5zM4.5 9.5h6v.5H4.5zM5 10h5v.5H5zM5.5 10.5h4v.5H5.5zM5.5 11h4v.5H5.5zM5.5 11.5h4v.5H5.5zM6 12h3v.5H6zM6.5 12.5h2v.5H6.5zM6.5 13h2v.5H6.5zM6.5 13.5h2v.5H6.5zM7 14h1v.5H7z"/>

  <!-- mantle (head/body, pointing up) -->
  <g fill="#c2476e">
    <rect x="6" y="0" width="4" height="1"/>
    <rect x="5" y="1" width="6" height="1"/>
    <rect x="4" y="2" width="8" height="1"/>
    <rect x="4" y="3" width="8" height="1"/>
    <rect x="4" y="4" width="8" height="1"/>
    <rect x="4" y="5" width="8" height="1"/>
    <rect x="5" y="6" width="6" height="1"/>
  </g>
  <!-- mantle highlight -->
  <g fill="#e0698f">
    <rect x="5" y="2" width="2" height="3"/>
  </g>
  <!-- big panic eyes (squeezed: pupils pulled in tighter) -->
  <rect x="5" y="3" width="2" height="2" fill="#fff"/>
  <rect x="9" y="3" width="2" height="2" fill="#fff"/>
  <rect x="6" y="4" width="1" height="1" fill="#152338"/>
  <rect x="9" y="4" width="1" height="1" fill="#152338"/>
  <!-- tentacles tightened: pulled together into a tapering jet point -->
  <g fill="#c2476e">
    <rect x="5" y="7" width="1" height="3"/>
    <rect x="6" y="7" width="1" height="4"/>
    <rect x="7" y="7" width="1" height="5"/>
    <rect x="8" y="7" width="1" height="4"/>
    <rect x="9" y="7" width="1" height="3"/>
    <rect x="6" y="11" width="3" height="1"/>
    <rect x="7" y="12" width="1" height="1"/>
  </g>
  <!-- suckers / tips -->
  <g fill="#7a2545">
    <rect x="7" y="13" width="1" height="1"/>
  </g>
</svg>
