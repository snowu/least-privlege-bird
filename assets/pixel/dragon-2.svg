<!-- Dragon frame 2 (wings DOWN, no fire). Shown every flap. Fire is a separate, rarer
     frame (dragon-fire.svg) so the flame doesn't flash on every single flap. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M11 3.5h1v.5H11zM13 3.5h1v.5H13zM10.5 4h4v.5H10.5zM10.5 4.5h4v.5H10.5zM10.5 5h4v.5H10.5zM9 5.5h6v.5H9zM8.5 6h7v.5H8.5zM8 6.5h7.5v.5H8zM7.5 7h8v.5H7.5zM6 7.5h9.5v.5H6zM5.5 8h9.5v.5H5.5zM1 8.5h2v.5H1zM5 8.5h7.5v.5H5zM0.5 9h3v.5H0.5zM4.5 9h7.5v.5H4.5zM0.5 9.5h3v.5H0.5zM4 9.5h9v.5H4zM0.5 10h13v.5H0.5zM0.5 10.5h13v.5H0.5zM1 11h12.5v.5H1zM1.5 11.5h12v.5H1.5zM2 12h3v.5H2zM6 12h7.5v.5H6zM6 12.5h7.5v.5H6zM5.5 13h8v.5H5.5zM5.5 13.5h3v.5H5.5zM10.5 13.5h3v.5H10.5zM6 14h2v.5H6zM11 14h2v.5H11z"/>

  <!-- long curved tail: low-left, flicks up at the tip -->
  <g fill="#ff6257">
    <rect x="6" y="9" width="2" height="1"/>
    <rect x="4" y="10" width="2" height="1"/>
    <rect x="3" y="11" width="2" height="1"/>
    <rect x="2" y="10" width="1" height="2"/>
  </g>
  <rect x="1" y="9" width="1" height="2" fill="#ffe27a"/>
  <rect x="2" y="9" width="1" height="1" fill="#ffe27a"/>
  <!-- BIG wing swept toward BOTTOM edge -->
  <g fill="#a92c62">
    <rect x="7" y="9" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2"/>
    <rect x="6" y="13" width="2" height="1"/>
    <rect x="9" y="10" width="2" height="3"/>
    <rect x="11" y="10" width="2" height="4"/>
  </g>
  <g fill="#55234e"><rect x="7" y="9" width="1" height="5"/><rect x="10" y="10" width="1" height="3"/><rect x="12" y="10" width="1" height="4"/></g>
  <g fill="#ffad78"><rect x="6" y="13" width="1" height="1"/><rect x="11" y="13" width="1" height="1"/></g>
  <!-- elongated body -->
  <g fill="#ff6257">
    <rect x="6" y="8" width="2" height="2"/>
    <rect x="8" y="7" width="3" height="2"/>
    <rect x="10" y="6" width="3" height="2"/>
  </g>
  <g fill="#ffb347"><rect x="7" y="9" width="2" height="1"/><rect x="9" y="8" width="3" height="1"/></g>
  <g fill="#a92c62"><rect x="9" y="6" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/></g>
  <!-- back leg tucked up over the down-swept wing -->
  <g fill="#a92c62"><rect x="5" y="9" width="2" height="2"/><rect x="4" y="10" width="3" height="1"/></g>
  <rect x="4" y="11" width="1" height="1" fill="#55234e"/>
  <rect x="6" y="11" width="1" height="1" fill="#55234e"/>
  <!-- front leg -->
  <g fill="#a92c62"><rect x="11" y="8" width="1" height="1"/></g>
  <!-- horns -->
  <g fill="#ffe27a"><rect x="11" y="4" width="1" height="1"/><rect x="13" y="4" width="1" height="1"/></g>
  <!-- head front-right, mouth closed -->
  <g fill="#ff6257"><rect x="11" y="5" width="3" height="3"/></g>
  <rect x="14" y="6" width="1" height="2" fill="#ffb347"/>
  <!-- eye -->
  <rect x="12" y="5" width="1" height="1" fill="#fff"/>
  <rect x="13" y="5" width="1" height="1" fill="#152338"/>
</svg>
