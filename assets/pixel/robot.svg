<!-- viewBox = squared content bbox so the body fills the same footprint as every other
     model. Robot frame 1 (arm RAISED). Bender (Futurama) inspired, side-profile facing
     RIGHT: segmented grey antenna, a clear glass eye-DOME with two round eyes, a wide
     curved smiling grille, a cylindrical chrome torso, two leg-poles with feet, and a
     bendy arm reaching forward-up to a 2-prong pincer claw. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M7 0.5h1v.5H7zM6.5 1h2v.5H6.5zM6.5 1.5h2v.5H6.5zM6.5 2h2v.5H6.5zM4 2.5h7v.5H4zM3.5 3h8v.5H3.5zM3.5 3.5h8v.5H3.5zM3.5 4h8v.5H3.5zM3.5 4.5h8v.5H3.5zM14 4.5h1v.5H14zM3.5 5h8v.5H3.5zM13.5 5h2v.5H13.5zM3.5 5.5h8v.5H3.5zM13 5.5h2.5v.5H13zM3.5 6h8v.5H3.5zM12.5 6h3v.5H12.5zM3.5 6.5h8v.5H3.5zM12 6.5h3.5v.5H12zM3.5 7h12v.5H3.5zM3.5 7.5h12v.5H3.5zM3.5 8h12v.5H3.5zM3.5 8.5h12v.5H3.5zM4 9h7v.5H4zM11.5 9h2v.5H11.5zM14 9h1v.5H14zM5 9.5h8.5v.5H5zM4.5 10h9v.5H4.5zM4.5 10.5h9v.5H4.5zM4.5 11h8.5v.5H4.5zM4.5 11.5h7v.5H4.5zM4.5 12h7v.5H4.5zM4.5 12.5h7v.5H4.5zM5 13h6v.5H5zM5 13.5h2.5v.5H5zM8.5 13.5h2.5v.5H8.5zM4.5 14h3v.5H4.5zM8.5 14h3v.5H8.5zM4.5 14.5h3v.5H4.5zM8.5 14.5h3v.5H8.5zM5 15h2v.5H5zM9 15h2v.5H9z"/>

  <!-- segmented antenna -->
  <rect x="7" y="1" width="1" height="2" fill="#9aa7b0"/>
  <rect x="7" y="2" width="1" height="1" fill="#58738e"/>
  <rect x="7" y="1" width="1" height="1" fill="#edf6ff"/>
  <!-- head can -->
  <g fill="#b4ccd7"><rect x="4" y="3" width="7" height="6"/></g>
  <rect x="4" y="3" width="7" height="1" fill="#edf6ff"/>
  <rect x="4" y="3" width="1" height="6" fill="#c9e1ea"/>
  <rect x="10" y="3" width="1" height="6" fill="#58738e"/>
  <!-- glass eye dome (Bender's visor) with two round eyes -->
  <g fill="#263238"><rect x="5" y="4" width="6" height="2"/></g>
  <rect x="7" y="4" width="1" height="1" fill="#fff"/>
  <rect x="9" y="4" width="1" height="1" fill="#fff"/>
  <rect x="7" y="5" width="1" height="1" fill="#00e5ff"/>
  <rect x="9" y="5" width="1" height="1" fill="#00e5ff"/>
  <!-- wide curved smiling grille -->
  <g fill="#37474f"><rect x="5" y="7" width="6" height="1"/></g>
  <rect x="5" y="7" width="1" height="1" fill="#263238"/>
  <rect x="10" y="7" width="1" height="1" fill="#263238"/>
  <rect x="6" y="7" width="1" height="1" fill="#c9e1ea"/>
  <rect x="8" y="7" width="1" height="1" fill="#c9e1ea"/>
  <!-- neck segment -->
  <rect x="6" y="9" width="3" height="1" fill="#7e9fb4"/>
  <!-- cylindrical chrome torso -->
  <g fill="#6e91a8"><rect x="5" y="10" width="6" height="3"/></g>
  <rect x="5" y="10" width="1" height="3" fill="#58738e"/>
  <rect x="10" y="10" width="1" height="3" fill="#3b5b78"/>
  <!-- door/chest seam + lights -->
  <rect x="7" y="10" width="1" height="3" fill="#3b5b78"/>
  <rect x="6" y="11" width="1" height="1" fill="#ff9800"/>
  <rect x="8" y="11" width="1" height="1" fill="#76ff03"/>
  <!-- leg poles + feet -->
  <g fill="#7e9fb4"><rect x="6" y="13" width="1" height="1"/><rect x="9" y="13" width="1" height="1"/></g>
  <g fill="#37474f"><rect x="5" y="14" width="2" height="1"/><rect x="9" y="14" width="2" height="1"/></g>
  <!-- bendy arm RAISED: shoulder up-forward to the pincer -->
  <g fill="#7e9fb4">
    <rect x="11" y="10" width="2" height="1"/>
    <rect x="12" y="8" width="1" height="2"/>
    <rect x="12" y="7" width="2" height="1"/>
  </g>
  <!-- 2-prong PINCER claw, open, at the arm tip -->
  <g fill="#b4ccd7">
    <rect x="14" y="5" width="1" height="2"/>
    <rect x="14" y="7" width="1" height="2"/>
  </g>
  <rect x="13" y="6" width="1" height="2" fill="#3b5b78"/>
</svg>
