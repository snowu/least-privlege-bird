<!-- "Barrel-flinging gorilla" frame 2: the knuckle arm pulls up into a paddle
     stroke alongside the head, mouth open in a holler. Same body/face/tie as
     monkey.svg, side-profile facing RIGHT. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M10 1.5h3v.5H10zM9.5 2h4v.5H9.5zM9.5 2.5h4v.5H9.5zM9.5 3h4v.5H9.5zM7 3.5h7v.5H7zM6.5 4h8v.5H6.5zM6.5 4.5h8.5v.5H6.5zM6.5 5h9v.5H6.5zM6.5 5.5h9v.5H6.5zM6.5 6h9v.5H6.5zM5 6.5h10.5v.5H5zM4.5 7h10.5v.5H4.5zM4 7.5h7.5v.5H4zM3.5 8h8v.5H3.5zM3.5 8.5h8v.5H3.5zM3.5 9h8v.5H3.5zM3.5 9.5h8v.5H3.5zM4 10h7v.5H4zM5.5 10.5h3v.5H5.5zM5.5 11h2.5v.5H5.5zM5.5 11.5h2v.5H5.5zM6 12h1v.5H6z"/>

  <!-- cranium + ear -->
  <rect x="10" y="2" width="3" height="2" fill="#4a2e1a"/>
  <rect x="10" y="2" width="1" height="1" fill="#2b1a0e"/>
  <!-- heavy brow ridge -->
  <rect x="10" y="4" width="4" height="1" fill="#2b1a0e"/>
  <!-- face -->
  <rect x="10" y="5" width="3" height="2" fill="#4a2e1a"/>
  <!-- muzzle (tan, jutting forward) -->
  <rect x="13" y="5" width="2" height="2" fill="#c79a6e"/>
  <!-- eye -->
  <rect x="11" y="5" width="1" height="1" fill="#e8d8b8"/>
  <!-- open holler mouth -->
  <rect x="13" y="6" width="1" height="1" fill="#7a2545"/>
  <!-- shoulder hump -->
  <rect x="7" y="4" width="3" height="3" fill="#4a2e1a"/>
  <!-- back sloping down to the rump -->
  <rect x="5" y="7" width="3" height="2" fill="#3a2414"/>
  <rect x="4" y="8" width="2" height="2" fill="#2b1a0e"/>
  <!-- chest / belly -->
  <rect x="8" y="7" width="3" height="3" fill="#c79a6e"/>
  <!-- DK-style tie -->
  <rect x="8" y="8" width="2" height="2" fill="#d13212"/>
  <!-- arm pulled up into a paddle stroke alongside the head -->
  <g fill="#3a2414">
    <rect x="10" y="6" width="1" height="2"/>
    <rect x="11" y="4" width="1" height="2"/>
    <rect x="12" y="2" width="1" height="2"/>
  </g>
  <!-- hind leg, tucked -->
  <rect x="6" y="9" width="2" height="2" fill="#3a2414"/>
  <rect x="6" y="11" width="1" height="1" fill="#2b1a0e"/>
</svg>
