<!-- viewBox = squared content bbox so the body fills the same footprint as every
     other model → the fixed circular hitbox stays visually fair. -->
<!-- "Total meltdown penguin": frazzled spiky tufts, bloodshot red bug-eyes, sweat
     beads, screaming beak, both flippers flailing mismatched. A bird that famously
     cannot fly, in a game about flapping. Deeply unqualified, and aware of it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M6 -0.5h1v.5H6zM8 -0.5h1v.5H8zM5.5 0h4v.5H5.5zM5 0.5h5v.5H5zM4.5 1h6v.5H4.5zM4.5 1.5h6v.5H4.5zM11 1.5h1v.5H11zM5 2h7.5v.5H5zM3 2.5h1v.5H3zM5 2.5h7.5v.5H5zM2.5 3h9.5v.5H2.5zM2.5 3.5h9.5v.5H2.5zM3 4h9.5v.5H3zM3 4.5h9.5v.5H3zM2.5 5h10v.5H2.5zM2 5.5h10.5v.5H2zM1.5 6h11v.5H1.5zM1.5 6.5h11.5v.5H1.5zM2 7h11.5v.5H2zM2.5 7.5h11.5v.5H2.5zM3 8h11.5v.5H3zM3.5 8.5h11v.5H3.5zM3.5 9h11v.5H3.5zM3.5 9.5h11v.5H3.5zM4 10h8v.5H4zM13 10h1v.5H13zM4.5 10.5h7v.5H4.5zM4.5 11h7v.5H4.5zM4 11.5h8v.5H4zM3.5 12h9v.5H3.5zM3.5 12.5h3v.5H3.5zM9.5 12.5h3v.5H9.5zM4 13h2v.5H4zM10 13h2v.5H10z"/>

  <!-- frazzled spiky head tufts (sticking up every which way) -->
  <g fill="#1a1a2e">
    <rect x="6" y="0" width="1" height="2"/>
    <rect x="8" y="0" width="1" height="2"/>
    <rect x="9" y="1" width="1" height="1"/>
    <rect x="5" y="1" width="1" height="1"/>
  </g>
  <!-- black back/head/body -->
  <g fill="#23233a">
    <rect x="6" y="2" width="4" height="1"/>
    <rect x="5" y="3" width="6" height="1"/>
    <rect x="4" y="4" width="8" height="1"/>
    <rect x="4" y="5" width="8" height="1"/>
    <rect x="4" y="6" width="8" height="1"/>
    <rect x="4" y="7" width="8" height="1"/>
    <rect x="4" y="8" width="8" height="1"/>
    <rect x="4" y="9" width="8" height="1"/>
    <rect x="5" y="10" width="6" height="1"/>
    <rect x="5" y="11" width="6" height="1"/>
  </g>
  <!-- white belly -->
  <g fill="#f2f4f8">
    <rect x="6" y="5" width="4" height="1"/>
    <rect x="6" y="6" width="5" height="1"/>
    <rect x="6" y="7" width="5" height="1"/>
    <rect x="6" y="8" width="5" height="1"/>
    <rect x="6" y="9" width="4" height="1"/>
    <rect x="6" y="10" width="4" height="1"/>
  </g>
  <!-- bug-eyes: white, with a bloodshot red corner pixel each, pinprick pupils
       pulled inward (panic) -->
  <rect x="5" y="3" width="2" height="2" fill="#fff"/>
  <rect x="8" y="3" width="2" height="2" fill="#fff"/>
  <rect x="5" y="3" width="1" height="1" fill="#e05050"/>
  <rect x="9" y="3" width="1" height="1" fill="#e05050"/>
  <rect x="6" y="4" width="1" height="1" fill="#152338"/>
  <rect x="8" y="4" width="1" height="1" fill="#152338"/>
  <!-- exhausted dark bags under outer edge of each eye (beak fills the centre) -->
  <rect x="5" y="5" width="1" height="1" fill="#3a3a5a"/>
  <rect x="9" y="5" width="1" height="1" fill="#3a3a5a"/>
  <!-- screaming open beak (orange, dark-red interior) -->
  <rect x="6" y="5" width="3" height="1" fill="#f5a623"/>
  <rect x="6" y="6" width="3" height="1" fill="#c0392b"/>
  <rect x="7" y="7" width="1" height="1" fill="#e8890c"/>
  <!-- flailing flipper (left, flung up) -->
  <g fill="#1a1a2e">
    <rect x="3" y="5" width="1" height="1"/>
    <rect x="2" y="6" width="2" height="1"/>
    <rect x="3" y="7" width="1" height="1"/>
  </g>
  <!-- flailing flipper (right, drooping down — mismatched) -->
  <g fill="#1a1a2e">
    <rect x="12" y="7" width="1" height="1"/>
    <rect x="12" y="8" width="2" height="1"/>
    <rect x="13" y="9" width="1" height="1"/>
  </g>
  <!-- sweat beads (flying off the head) -->
  <rect x="11" y="2" width="1" height="1" fill="#7ec8f2"/>
  <rect x="3" y="3" width="1" height="1" fill="#7ec8f2"/>
  <!-- orange feet (splayed) -->
  <g fill="#f5a623">
    <rect x="4" y="12" width="2" height="1"/>
    <rect x="10" y="12" width="2" height="1"/>
  </g>
</svg>
