<!-- Horse frame 2 (gallop GATHERED: legs tucked under the body, the suspension moment of
     a gallop). Shown for a beat after each flap → with frame 1 it reads as a running cycle.
     Same body; only the legs change. Mane/tail streamers drawn in drawPlayer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 14 14" width="40" height="40" shape-rendering="crispEdges">
  <!-- Shared stepped navy silhouette: readable against bright sky and busy scenery. -->
  <path fill="#152338" d="M12 1.5h1v.5H12zM11.5 2h2v.5H11.5zM10 2.5h5v.5H10zM9.5 3h6v.5H9.5zM9.5 3.5h6v.5H9.5zM10 4h5.5v.5H10zM10 4.5h5.5v.5H10zM9.5 5h6v.5H9.5zM5 5.5h10.5v.5H5zM4.5 6h10.5v.5H4.5zM4 6.5h9.5v.5H4zM3.5 7h9.5v.5H3.5zM3 7.5h9.5v.5H3zM2.5 8h10v.5H2.5zM2.5 8.5h10v.5H2.5zM2.5 9h10v.5H2.5zM2.5 9.5h10v.5H2.5zM3 10h9v.5H3zM5.5 10.5h6v.5H5.5zM5.5 11h6v.5H5.5zM5.5 11.5h6v.5H5.5zM5.5 12h6v.5H5.5zM5.5 12.5h6v.5H5.5zM6 13h2.5v.5H6zM9 13h2.5v.5H9zM6.5 13.5h2v.5H6.5zM9.5 13.5h2v.5H9.5zM7 14h1v.5H7zM10 14h1v.5H10z"/>

  <!-- tail base -->
  <rect x="4" y="7" width="1" height="3" fill="#5a3823"/>
  <rect x="3" y="8" width="1" height="2" fill="#4a2c1a"/>
  <!-- barrel body -->
  <g fill="#a86a42"><rect x="5" y="6" width="7" height="4"/></g>
  <rect x="5" y="6" width="7" height="1" fill="#bd7d52"/>
  <rect x="5" y="9" width="7" height="1" fill="#8d5a3b"/>
  <!-- chest / shoulder -->
  <rect x="10" y="5" width="2" height="4" fill="#a86a42"/>
  <!-- arched neck -->
  <rect x="11" y="4" width="2" height="3" fill="#a86a42"/>
  <!-- mane base along the neck crest -->
  <rect x="10" y="3" width="2" height="1" fill="#5a3823"/>
  <rect x="11" y="4" width="1" height="2" fill="#5a3823"/>
  <!-- head + muzzle -->
  <rect x="12" y="3" width="3" height="3" fill="#a86a42"/>
  <rect x="14" y="5" width="1" height="1" fill="#8d5a3b"/>
  <!-- ear -->
  <rect x="12" y="2" width="1" height="1" fill="#8d5a3b"/>
  <!-- eye + nostril -->
  <rect x="13" y="4" width="1" height="1" fill="#1a1008"/>
  <rect x="14" y="5" width="1" height="1" fill="#1a1008"/>
  <!-- ALL legs gathered/tucked under the barrel (suspension moment) -->
  <g fill="#8d5a3b">
    <rect x="10" y="10" width="1" height="2"/><rect x="10" y="12" width="1" height="1"/> <!-- front near -->
    <rect x="9"  y="10" width="1" height="2"/>                                            <!-- front far -->
    <rect x="7"  y="10" width="1" height="2"/><rect x="7" y="12" width="1" height="1"/>  <!-- hind near -->
    <rect x="6"  y="10" width="1" height="2"/>                                            <!-- hind far -->
  </g>
  <!-- hooves tucked under the barrel -->
  <g fill="#2b1a0e">
    <rect x="10" y="13" width="1" height="1"/>
    <rect x="9"  y="12" width="1" height="1"/>
    <rect x="7"  y="13" width="1" height="1"/>
    <rect x="6"  y="12" width="1" height="1"/>
  </g>
</svg>
